# Query API Contract for RAG Chatbot Agent

## Version: 1.0.0

This document specifies the contract for the query API that routes requests through the RAG Chatbot Agent.

## Base Path
`/api/v1`

## Endpoints

### POST /query
Process a natural language query through the RAG Chatbot Agent.

#### Request
**Content-Type**: `application/json`

**Body**:
```json
{
  "query": "string (required) - The natural language query from the user",
  "session_id": "string (optional, UUID format) - Session identifier for conversation context",
  "temperature": "number (optional) - LLM temperature parameter (0.0 to 1.0, default: 0.7)",
  "max_tokens": "integer (optional) - Maximum tokens for response (1 to 4096, default: 1024)"
}
```

**Example Request**:
```json
{
  "query": "What are the key features of this RAG system?",
  "session_id": "123e4567-e89b-12d3-a456-426614174000",
  "temperature": 0.7,
  "max_tokens": 1024
}
```

#### Response
**Success Response (200 OK)**:
```json
{
  "response": "string - The agent's response to the query",
  "sources": [
    {
      "title": "string - Title of the source document",
      "url": "string (optional) - URL to the source document",
      "text_snippet": "string - Relevant text snippet from the source",
      "score": "number - Relevance score (0.0-1.0)"
    }
  ],
  "session_id": "string - The session identifier used",
  "tokens_used": {
    "input_tokens": "integer - Number of tokens in the input",
    "output_tokens": "integer - Number of tokens in the output",
    "total_tokens": "integer - Total number of tokens (input + output)"
  },
  "timestamp": "string - ISO 8601 timestamp of the response"
}
```

**Example Response**:
```json
{
  "response": "The key features of this RAG system include retrieval-augmented generation, multi-turn conversation support, and contextual grounding in documentation...",
  "sources": [
    {
      "title": "RAG System Documentation",
      "url": "https://docs.example.com/rag-system",
      "text_snippet": "The RAG system combines retrieval and generation to provide contextually relevant responses...",
      "score": 0.87
    }
  ],
  "session_id": "123e4567-e89b-12d3-a456-426614174000",
  "tokens_used": {
    "input_tokens": 128,
    "output_tokens": 96,
    "total_tokens": 224
  },
  "timestamp": "2025-12-24T10:30:00.000Z"
}
```

**Error Responses**:
- `400 Bad Request`: Invalid request parameters
- `429 Too Many Requests`: Rate limit exceeded
- `500 Internal Server Error`: Server error during processing
- `503 Service Unavailable`: External service (LLM/Qdrant) unavailable

### POST /query/batch
Process multiple queries in batch through the RAG Chatbot Agent.

#### Request
**Content-Type**: `application/json`

**Body**:
```json
[
  {
    "query": "string - The natural language query from the user",
    "session_id": "string (optional, UUID format) - Session identifier",
    "temperature": "number (optional) - LLM temperature parameter",
    "max_tokens": "integer (optional) - Maximum tokens for response"
  }
]
```

#### Response
**Success Response (200 OK)**:
```json
[
  {
    "response": "string - The agent's response to the query",
    "sources": [...],
    "session_id": "string - The session identifier used",
    "tokens_used": {...},
    "timestamp": "string - ISO 8601 timestamp of the response"
  },
  null  // For failed queries in the batch
]
```

### GET /query/health
Check the health of the query service.

#### Response
**Success Response (200 OK)**:
```json
{
  "status": "string - Health status (healthy/unhealthy)",
  "service": "string - Service name (query)",
  "agent": "string - Agent name (RAG Chatbot Agent)",
  "timestamp": "string - ISO 8601 timestamp"
}
```

### GET /query/stats
Get query processing statistics.

#### Response
**Success Response (200 OK)**:
```json
{
  "total_queries_processed": "integer - Total number of queries processed",
  "average_response_time_ms": "number - Average response time in milliseconds",
  "success_rate": "number - Success rate as decimal (0.0-1.0)",
  "active_sessions": "integer - Number of active conversation sessions",
  "agent_model": "string - Model being used by the agent",
  "timestamp": "string - ISO 8601 timestamp"
}
```

## Security
- API keys (if required) should be passed in headers
- Requests should be validated for proper content types
- Rate limiting should be enforced per IP/session

## Error Handling
- Errors should follow the common error format:
```json
{
  "error": "string - Error message",
  "error_code": "string - Error code",
  "details": {
    "message": "string - Detailed error message"
  }
}
```

## Session Management
- If no session_id is provided, a new session is created automatically
- Sessions timeout after 30 minutes of inactivity
- Session context is maintained across requests with the same session_id