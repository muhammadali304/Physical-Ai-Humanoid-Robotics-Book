[project]
name = "backend"
version = "0.1.0"
description = "RAG Ingestion Pipeline and RAG Agent Backend with OpenAI Agents SDK using Gemini"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "cohere>=4.0.0",
    "qdrant-client>=1.6.0",
    "python-dotenv>=1.0.0",
    "redis>=4.5.0",
    "rq>=1.13.0",
    "openai>=1.0.0",
    "numpy>=1.21.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.0.0",
]
